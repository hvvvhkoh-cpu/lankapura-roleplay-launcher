plugins { id 'com.android.application' }

android {
    namespace 'com.lankapura.roleplay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lankapura.roleplay'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
